name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install -y innosetup

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "0.1.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\huzar_setup.iss

      - name: Package Windows Portable Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "latest" }
          $pkgName = "huzar-commander-$tag-windows-x64"
          New-Item -ItemType Directory -Path $pkgName
          Copy-Item target/release/huzar-commander.exe -Destination $pkgName/
          Copy-Item -Recurse locales -Destination $pkgName/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE -Destination $pkgName/
          Compress-Archive -Path $pkgName/* -DestinationPath "$pkgName.zip"
          Write-Output "PACKAGE_ZIP=$pkgName.zip" >> $env:GITHUB_ENV

      - name: Upload Windows Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/installer/HuzarCommander-Setup-*.exe
            huzar-commander-*-windows-x64.zip
          generate_release_notes: true

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libgl1-mesa-dev libfontconfig1-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Linux Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          PKG_NAME="huzar-commander-$TAG-linux-x64"
          mkdir -p "$PKG_NAME"
          cp target/release/huzar-commander "$PKG_NAME/"
          cp -r locales "$PKG_NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$PKG_NAME/"
          tar -czf "$PKG_NAME.tar.gz" -C "$PKG_NAME" .

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          files: huzar-commander-*-linux-x64.tar.gz
          generate_release_notes: true
